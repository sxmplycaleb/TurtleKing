name: turtle_king
description: "Turtle King — a pass-and-play card game for friends."
publish_to: 'none'
version: 1.2.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Minimal, standard persistence for the personalization settings
  # (theme mode, color theme, card design) across app restarts.
  shared_preferences: ^2.5.3
  # Lightweight short-sound-effect playback for the M17/M17.1 sound
  # feedback (Android media3/ExoPlayer, iOS/macOS AVAudioPlayer).
  # audioplayers is the maintained successor to the discontinued `soundpool`
  # package, which is incompatible with current Flutter (legacy v1
  # embedding API was removed).
  audioplayers: ^6.8.1
  # M18.5: QR rendering for the host's join QR code (BSD-3-Clause, pure
  # Dart widget layer over the `qr` codec — no native code).
  qr_flutter: ^4.1.0
  # M18.5: QR scanning for the client's "Scan QR" join path (BSD-3-Clause,
  # CameraX/ML Kit on Android, actively maintained). Adds the camera
  # permission; see AndroidManifest.xml.
  mobile_scanner: ^7.4.0
  # v1.2.0: reads the app version for the Settings → About display. The
  # version is never hardcoded in Dart — this package reads the platform
  # package metadata (versionName / CFBundleShortVersionString) that the
  # Flutter build populates from pubspec.yaml's `version:` field, so the
  # displayed version stays in sync automatically.
  package_info_plus: ^10.2.1
  # M19: Bluetooth Low Energy transport for local/offline multiplayer
  # (host-as-peripheral / clients-as-centrals). MIT license (no commercial
  # trap — unlike flutter_blue_plus), supports both central and peripheral
  # roles on Android + iOS, minSdk 24 matches the project. The session layer
  # stays transport-agnostic; this package only backs the BLE adapter seam.
  bluetooth_low_energy: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: lets the engine contract test substitute fake audioplayers
  # platforms so the real AudioplayersEngine runs deterministically without
  # audio hardware. Already in the dependency graph via audioplayers.
  audioplayers_platform_interface: ^7.2.0
  # Test-only: SHA-256 for pinning the preserved Hold Out asset and checking
  # that the seven sounds are distinct. Already in the dependency graph.
  crypto: ^3.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
