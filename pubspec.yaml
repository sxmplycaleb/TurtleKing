name: turtle_king
description: "Turtle King — a pass-and-play card game for friends."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Minimal, standard persistence for the personalization settings
  # (theme mode, color theme, card design) across app restarts.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
